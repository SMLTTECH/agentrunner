<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жизненный цикл пакета в реестре</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Состояния · Пакет инструментов</p>
    <h1>Жизненный цикл пакета в реестре</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="status-title status-desc">
        <title id="status-title">Жизненный цикл пакета в реестре</title>
        <desc id="status-desc">Диаграмма состояний пакета инструментов: зарегистрирован, отклонён, отключён и требует переподтверждения после изменения манифеста.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <path d="M480,102 V200" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M474,96 H140 Q132,96 132,104 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M224,236 H388" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M572,216 H736" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M736,256 H572" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M450,272 V360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M510,360 V272" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <circle cx="480" cy="96" r="6" fill="#2d3142"/>
        <rect x="490" y="147" width="101" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="156" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">регистрация прошла</text>
        <rect x="233" y="75" width="146" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">манифест не прошёл проверку</text>
        <rect x="248" y="215" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">повторная регистрация</text>
        <rect x="608" y="195" width="91" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ОтключитьПакет()</text>
        <rect x="596" y="239" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">повторная регистрация</text>
        <rect x="320" y="313" width="126" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">хеш манифеста изменился</text>
        <rect x="514" y="313" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">повторная регистрация</text>
        <rect x="40" y="200" width="184" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="40" y="200" width="184" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="132.0" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Отклонён</text>
        <text x="132.0" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">причина в журнале</text>
        <rect x="388" y="200" width="184" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="388" y="200" width="184" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="480.0" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Зарегистрирован</text>
        <text x="480.0" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools доступны агенту</text>
        <rect x="736" y="200" width="184" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="736" y="200" width="184" height="72" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="828.0" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Отключён</text>
        <text x="828.0" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools выключены</text>
        <rect x="368" y="360" width="224" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="368" y="360" width="224" height="72" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="480.0" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ТребуетПереподтверждения</text>
        <text x="480.0" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools недоступны</text>
        <line x1="32" y1="444" x2="928" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="32" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ОБОЗНАЧЕНИЯ</text>
        <rect x="32" y="472" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="52" y="481" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Рабочее состояние</text>
        <line x1="208" y1="477" x2="236" y2="477" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="244" y="481" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Успешная регистрация</text>
        <line x1="404" y1="477" x2="432" y2="477" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="440" y="481" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Возврат в работу</text>

      </svg>
    </div>
  </div>
</body>
</html>
